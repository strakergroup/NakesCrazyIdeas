[project]
name = "content-assurance-service"
version = "0.1.0"
description = "Provisional evidence-backed content assessment and authenticated release service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "python-docx>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
assurance = "assurance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: deliberately enabled external provider smoke test"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
